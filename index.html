<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>N-Back Verbal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Entrenamiento N-Back Verbal</h1>

        <div class="game-panel">
            <div id="letterDisplay">?</div>
        </div>

        <div class="controls">
            <button id="matchBtn">Coincide</button>
            <button id="noMatchBtn">No coincide</button>
        </div>

        <div class="info">
            <p>N actual: <span id="nLevel">2</span></p>
            <p>Puntuación: <span id="score">0</span></p>
            <p>Intentos: <span id="attempts">0</span></p>
        </div>

        <button id="startBtn">Iniciar juego</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
